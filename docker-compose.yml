# One command to start the warehouse: docker compose up -d
services:
  postgres:
    image: postgres:16
    container_name: swiggy_pg
    environment:
      POSTGRES_DB: swiggy
      POSTGRES_USER: ${POSTGRES_ADMIN_USER:-swiggy_admin}
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:-admin_dev_pw}
      # Passwords for the two login roles, read by scripts/init_db.sh on first start
      ETL_PASSWORD: ${ETL_PASSWORD:-etl_dev_pw}
      ASSISTANT_PASSWORD: ${ASSISTANT_PASSWORD:-assistant_dev_pw}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - swiggy_pgdata:/var/lib/postgresql/data
      - ./scripts/init_db.sh:/docker-entrypoint-initdb.d/00_init_db.sh:ro
      - ./sql/00_roles_schemas.sql:/sql/00_roles_schemas.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_ADMIN_USER:-swiggy_admin} -d swiggy"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  swiggy_pgdata:
