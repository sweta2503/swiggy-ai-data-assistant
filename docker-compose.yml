# One command to start the warehouse: docker compose up -d
# Optional pgAdmin (a web UI for the database, for showing it on screen): make pgadmin
services:
  postgres:
    image: postgres:16
    container_name: swiggy_pg
    environment:
      POSTGRES_DB: swiggy
      POSTGRES_USER: ${POSTGRES_ADMIN_USER:-swiggy_admin}
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:-admin_dev_pw}
      # Passwords for the two login roles, read by scripts/init_db.sh on first start
      ETL_PASSWORD: ${ETL_PASSWORD:-etl_dev_pw}
      ASSISTANT_PASSWORD: ${ASSISTANT_PASSWORD:-assistant_dev_pw}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - swiggy_pgdata:/var/lib/postgresql/data
      - ./scripts/init_db.sh:/docker-entrypoint-initdb.d/00_init_db.sh:ro
      - ./sql/00_roles_schemas.sql:/sql/00_roles_schemas.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_ADMIN_USER:-swiggy_admin} -d swiggy"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Optional: not started by `make up`. `make pgadmin` starts it at http://localhost:5050.
  pgadmin:
    image: dpage/pgadmin4:9.9
    profiles: ["tools"]
    container_name: swiggy_pgadmin
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@swiggy.local
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin_dev_pw}
      PGADMIN_CONFIG_SERVER_MODE: "False"  # one local user: no sign-in screen
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
    ports:
      - "127.0.0.1:5050:80"  # this machine only
    volumes:
      - swiggy_pgadmin_data:/var/lib/pgadmin
      - ./scripts/pgadmin_servers.json:/pgadmin4/servers.json:ro

volumes:
  swiggy_pgdata:
  swiggy_pgadmin_data:
