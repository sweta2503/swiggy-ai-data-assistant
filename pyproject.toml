[project]
name = "swiggy-ai-data-assistant"
version = "0.1.0"
requires-python = ">=3.11"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
  "live: needs OPENAI_API_KEY and calls the real API (skipped otherwise)",
  "db: needs the Postgres container running",
]
